<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Subject</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, Arial, sans-serif; margin: 24px; background:#f6f7f9; }
      .wrap { max-width: 640px; margin: 0 auto; }
      .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:16px; }
      .row { margin-bottom: 12px; }
      label { display:block; font-size:14px; margin-bottom:6px; color:#374151; }
      input { width:100%; padding:10px; border:1px solid #e5e7eb; border-radius:8px; }
      .btn { display:inline-block; padding:10px 14px; border:1px solid #e5e7eb; border-radius:10px; background:#f3f4f6; color:#111; text-decoration:none; font-weight:600; }
      .submit { background:#5a78ff; color:#fff; border:0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="btn" href="/supervisor/subjects" style="margin-bottom:12px; display:inline-block;">Back</a>
      <div class="card">
        <h2>Edit Subject</h2>
        <form th:action="@{'/supervisor/subjects/' + ${subject.id} + '/edit'}" method="post">
          <div class="row">
            <label>Name</label>
            <input name="name" th:value="${subject.name}" required />
          </div>
          <button class="btn submit" type="submit">Save</button>
        </form>
      </div>
    </div>
  </body>
 </html>
