<!DOCTYPE html>
<html>
<head>
    <title>Generated Students</title>
</head>
<body>
    <h1>Generated Students</h1>

    <p th:text="${message}"></p>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Password</th>
            <th>Class</th>
        </tr>
        <tr th:each="student : ${students}">
            <td th:text="${student['ID']}"></td>
            <td th:text="${student['Username']}"></td>
            <td th:text="${student['Password']}"></td>
            <td th:text="${student['Class']}"></td>
        </tr>
    </table>

    <div style="margin-top: 12px;">
        <a href="/supervisor/dashboard" style="display:inline-block;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;background:#f3f4f6;color:#111;text-decoration:none;font-weight:600;">Back to Dashboard</a>
    </div>

</body>
</html>
