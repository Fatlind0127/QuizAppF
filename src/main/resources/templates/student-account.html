<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Student</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f6f7f9; padding:24px; }
        .container { max-width: 680px; margin: 0 auto; }
        .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:18px; }
        .title { font-size:20px; margin-bottom:12px; color:#111; }
        .row { margin-bottom:12px; }
        label { display:block; font-size:14px; color:#374151; margin-bottom:6px; }
        input { width:100%; padding:10px; border:1px solid #e5e7eb; border-radius:8px; }
        .btn { padding:10px 14px; border-radius:10px; border:1px solid #e5e7eb; background:#4facfe; color:#fff; font-weight:600; cursor:pointer; }
        .muted { color:#6b7280; font-size:14px; margin-bottom:10px; }
        .alert { padding:10px; border-radius:8px; margin-bottom:12px; }
        .error { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
        .success { background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
        .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        a.link { display:inline-block; padding:8px 12px; border:1px solid #e5e7eb; border-radius:8px; background:#f3f4f6; color:#111; text-decoration:none; font-weight:600; }
    </style>
    <script>
      function mapError(param) {
        const m = new URLSearchParams(window.location.search).get('error');
        if (!m) return '';
        switch (m) {
          case 'invalid_current': return 'Current password is incorrect.';
          case 'weak_password': return 'New password must be at least 6 characters.';
          case 'nomatch': return 'New password and confirmation do not match.';
          default: return 'An error occurred.';
        }
      }
      document.addEventListener('DOMContentLoaded', () => {
        const err = mapError();
        if (err) {
          const el = document.getElementById('err');
          el.textContent = err;
          el.style.display = 'block';
        }
      });
    </script>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="muted">Signed in as <strong th:text="${currentUser.username}">student</strong></div>
      <div>
        <a href="/student/home" class="link">Back</a>
        <a href="/logout" class="link">Logout</a>
      </div>
    </div>
    <div id="err" class="alert error" style="display:none"></div>
    <div th:if="${success}" class="alert success">Password updated successfully.</div>
    <div class="card">
      <div class="title">Change Password</div>
      <form action="/student/account" method="post">
        <div class="row">
          <label for="currentPassword">Current Password</label>
          <input id="currentPassword" name="currentPassword" type="password" required />
        </div>
        <div class="row">
          <label for="newPassword">New Password</label>
          <input id="newPassword" name="newPassword" type="password" minlength="6" required />
        </div>
        <div class="row">
          <label for="confirmPassword">Confirm New Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required />
        </div>
        <button class="btn" type="submit">Update Password</button>
      </form>
    </div>
  </div>
</body>
</html>
